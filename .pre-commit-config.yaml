default_stages: [pre-commit, commit-msg]
exclude: '.git'
fail_fast: true

default_language_version:
    python: python3.10 # sync with pyproject.toml

repos:
    - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
      rev: v9.24.0
      hooks:
          - id: commitlint
            stages: [commit-msg]
            additional_dependencies: ['@arrai-innovations/commitlint-config']

    - repo: https://github.com/syntaqx/git-hooks
      rev: v0.0.18
      hooks:
          - id: circleci-config-validate
            stages: [pre-commit]
            files: ^.circleci/config.yml$

    - repo: https://github.com/astral-sh/ruff-pre-commit
      # sync with pyproject.toml
      rev: v0.15.5
      hooks:
          - id: ruff-check
            args: [--fix, --show-fixes]
            stages: [pre-commit]
          - id: ruff-format
            stages: [pre-commit]

    - repo: https://github.com/frnmst/md-toc
      rev: 9.0.0
      hooks:
          - id: md-toc
            stages: [pre-commit]
            args: [-p, github, -u, -l6]
            files: '.*\.md'
